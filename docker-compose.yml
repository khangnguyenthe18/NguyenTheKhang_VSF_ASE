services:
  mailpit:
    image: axllent/mailpit:v1.23
    container_name: ase-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: 500

  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: ase-mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./ase/streaming/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.5
    container_name: ase-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --node-id 0
      - --mode dev-container
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://127.0.0.1:19092
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --default-log-level=warn
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:19644:9644"
