# Nước đã triển khai (CLAUDE.md §10): chỉ VN, PH, ID. Thêm nước = thêm khối ở đây, không sửa code.
# Bảng giá: chính sách VinFast do chủ dự án cung cấp 05/11/2026.
#   swap_fee      : phí /pin/lần đổi (currency của nước).
#   packages      : gói thuê pin (RENT_1/RENT_2 mọi nước; FLEET = vận doanh Green SM, chỉ VN).
#                   Pin mua đứt không dùng được dịch vụ đổi pin → không có gói, simulator không sinh.
#   promotions    : ưu đãi miễn phí; free_swaps_per_month: null = không giới hạn;
#                   duration_months tính từ ngày kích hoạt gói của user.
# Simulator mặc định pricing_mode=standard_fee: mọi lần đổi tính swap_fee × số pin, bỏ qua promotions
# (để bước 5 luôn có giao dịch tiền). promotions lưu để dùng sau (pricing_mode=promo).

countries:
  VN:
    traffic_weight: 0.70
    currency: VND
    timezones: [Asia/Ho_Chi_Minh]
    cities:
