# Nước đã triển khai (CLAUDE.md §10): chỉ VN, PH, ID. Thêm nước = thêm khối ở đây, không sửa code.
# Giá là số liệu MOCK theo currency từng nước (không phải bảng giá thật).
package_types: [PKG_BASIC, PKG_STANDARD, PKG_PREMIUM]

countries:
  VN:
    traffic_weight: 0.70
    currency: VND
    timezones: [Asia/Ho_Chi_Minh]
    payment_providers: [VN_WALLET_1, VN_WALLET_2, VN_CARD]
    swap_price: {PKG_BASIC: 30000, PKG_STANDARD: 25000, PKG_PREMIUM: 20000}
  PH:
    traffic_weight: 0.17
    currency: PHP
    timezones: [Asia/Manila]
    payment_providers: [PH_WALLET_1, PH_CARD]
    swap_price: {PKG_BASIC: 60, PKG_STANDARD: 50, PKG_PREMIUM: 40}
  ID:
    traffic_weight: 0.13
    currency: IDR
    timezones: [Asia/Jakarta, Asia/Makassar]  # WIB + WITA: 2 múi giờ trong 1 nước
    payment_providers: [ID_WALLET_1, ID_CARD]
    swap_price: {PKG_BASIC: 20000, PKG_STANDARD: 17000, PKG_PREMIUM: 14000}

