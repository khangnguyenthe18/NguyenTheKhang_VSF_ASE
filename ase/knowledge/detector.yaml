# Cấu hình detector, correlator, tầng trường (T0–T3) và lịch gửi thông báo (DETECTOR_PLAN §2, §4, §6).
# Không hardcode các tham số này trong code; luôn đọc qua `default_knowledge().detector`.

correlator:
  window_minutes: 5
  # Cửa sổ riêng theo nhóm. SYSTEM lan rộng nhiều trạm/nước nhưng thưa theo thời gian (dev: khoảng
  # trống tối đa 11' trong 1 sự cố deploy_503) → 15' (= 1 chu kỳ tin gom) để ra đúng 1 incident.
  window_minutes_by_category:
    SYSTEM: 15
  # Mã lỗi gộp theo mã trên toàn mạng (giống SYSTEM), không tách theo provider/trạm.
  # PAID_NOT_DELIVERED: tủ không nhả pin sau khi đã trừ tiền — nguyên nhân ở đường tủ/tài sản,
  # không ở cổng thanh toán; tách theo provider làm 1 sự cố ra nhiều alert P1 (SF8).
  network_wide_error_codes: [PAID_NOT_DELIVERED]
  user_spike_window_minutes: 15
  user_spike_min_sessions: 10
  cluster_confidence_threshold: 0.8
  max_evidence_ids: 5

classifier:
  heartbeat_gap_seconds: 120
  paid_not_delivered_confidence: 0.98
  catalog_confidence: 0.95
  inferred_confidence: 0.70
  unknown_confidence: 0.30
  # Phiên kẹt quá SLA (STEP_TIMEOUT, không có mã lỗi) ở bước do tủ IoT phụ trách (CLAUDE.md §2:
  # bước 6–7 thuộc Cabinet IoT) → nhóm theo bảng này. R_PAID_NOT_DELIVERED vẫn được xét trước.
  timeout_category_by_step:
    6_return_battery: HARDWARE
    7_receive_battery: HARDWARE

notify:
  batch_interval_minutes: 15
  max_rows_mail: 200
  daily_report_local_time: "18:00"
  daily_report_timezone: "Asia/Ho_Chi_Minh"

# Agent quét "Danh sách giao dịch đổi pin" (CLAUDE.md §8, docs/OPS_AGENT_PLAN.md).
scan:
  interval_minutes: 30          # mốc tròn :00 / :30 — mỗi lần quét tối đa 1 thông báo (tránh spam OPS)
  lookback_minutes: 60          # mỗi lần quét nhìn lại các giao dịch bắt đầu trong khoảng này
  stuck_after_minutes: 10       # Tạo mới / Đưa pin vào đứng yên quá ngưỡng này = giao dịch kẹt
  timezone: "Asia/Ho_Chi_Minh"  # giờ của đội OPS trên tiêu đề thông báo
  max_rows_mail: 200            # số dòng chi tiết tối đa trong thân mail (CSV đính kèm luôn đủ)
  # Gộp sự cố theo mẫu phân bố (bảng mã chuẩn không có nhóm lỗi). Một mã chỉ thành sự cố khi số
  # lỗi trong lần quét VƯỢT MỨC NỀN của chính mã đó (kiểm định Poisson), hoặc mã có mức High.
  baseline_days: 7              # mức nền = tỷ lệ lỗi của từng mã trong N ngày gần nhất
  baseline_prior_rate: 0.005    # tỷ lệ giả định khi chưa đủ lịch sử ...
  baseline_prior_txns: 1000     # ... với trọng số tương đương N giao dịch
  baseline_alpha: 0.001         # ngưỡng xác suất "do ngẫu nhiên" để coi là bất thường
  wide_min_stations: 3          # cùng một mã ở ≥ N trạm ...
  wide_min_txns: 5              # ... và ≥ N giao dịch trong một lần quét → sự cố lan rộng
  station_min_cabinets: 2       # lỗi đáng chú ý ở ≥ N tủ của một trạm ...
  station_min_txns: 3           # ... và ≥ N giao dịch → sự cố mức trạm
  cabinet_min_txns: 2           # ≥ N giao dịch cùng mã tại một tủ và vượt nền → sự cố mức tủ
  # Lỗi mới nối vào sự cố đang mở nếu lần gần nhất của sự cố còn trong khoảng này (phút).
  continue_minutes: {WIDE: 60, STATION: 120, CABINET: 1440}

stream:
  allowed_lateness_seconds: 10

# Tầng trường dữ liệu (CLAUDE.md §10.1).
field_tiers:
  T0:
    - session_id
    - occurred_at
    - step
    - status
    - station_id
    - country
    - timezone
  T1:
    - error_code
    - cabinet_id
    - slot_id
    - payment.captured
    - payment_provider
  T2:
    - app_version
    - battery_id
    - lot_id
    - soc
    - soh
    - user_id
    - latency_ms
  T3:
    - door_state
    - battery_detected
    - heartbeat_at
    - temperature
    - hw_error_code

field_presets:
  T0: [T0]
  T0+T1: [T0, T1]
  T0+T1+T2: [T0, T1, T2]
  ALL: [T0, T1, T2, T3]
