# Định nghĩa các kịch bản lỗi inject (MOCK_PLAN §8, §3a, §12).
# Mỗi kịch bản chỉ định cửa sổ thời gian theo từng profile (`smoke`, `dev`, `eval`).
# Lưu ý bước 12: Trong profile `eval`, các cửa sổ có `day >= 20` thuộc `split: test`
# (xác định bởi `profiles.yaml`) và được đóng băng trước khi viết rule cho detector.

lot_low_soh_id: "LOT-F"
lot_low_soh_range: [58.0, 68.0]

scenarios:
  # 1. Deploy lỗi session-service 503 trong 40', phủ cả 3 nước (VN+PH+ID) -> 1 scenario_instance_id
  - name: deploy_503
    category: SYSTEM
    error_code: SESS_CREATE_5XX
    step: 3_scan_qr
    kind: global_window
    fail_prob: 0.85
    pre_window_minutes: 15       # latency_ms tăng dần 15' trước khi fail
    windows:
      smoke:
        - {instance_idx: 1, day: 0, utc_hour: 3, minute: 0, duration_minutes: 40}
      dev:
        - {instance_idx: 1, day: 2, utc_hour: 3, minute: 0, duration_minutes: 40}
        - {instance_idx: 2, day: 9, utc_hour: 10, minute: 0, duration_minutes: 40}
        - {instance_idx: 3, day: 12, utc_hour: 2, minute: 30, duration_minutes: 40}
      demo:
        - {instance_idx: 1, day: 2, utc_hour: 3, minute: 0, duration_minutes: 40}
      eval:
        - {instance_idx: 1, day: 5, utc_hour: 3, minute: 0, duration_minutes: 40}
        - {instance_idx: 2, day: 14, utc_hour: 10, minute: 0, duration_minutes: 40}
        - {instance_idx: 3, day: 21, utc_hour: 2, minute: 0, duration_minutes: 45}
        - {instance_idx: 4, day: 26, utc_hour: 10, minute: 0, duration_minutes: 45}

  # 2. App v3.2.1 lỗi quét QR ở bước 3
  - name: app_v321_qr_bug
    category: SYSTEM
    error_code: SESS_CREATE_5XX
    step: 3_scan_qr
    kind: app_version
    app_version: "3.2.1"
    fail_prob: 0.55
    windows:
      smoke:
        - {instance_idx: 1, day: 0, utc_hour: 6, minute: 0, duration_minutes: 180}
      dev:
        - {instance_idx: 1, day: 3, utc_hour: 1, minute: 0, duration_minutes: 360}
        - {instance_idx: 2, day: 8, utc_hour: 1, minute: 0, duration_minutes: 360}
        - {instance_idx: 3, day: 11, utc_hour: 9, minute: 0, duration_minutes: 360}
      demo:
        - {instance_idx: 1, day: 1, utc_hour: 1, minute: 0, duration_minutes: 360}
      eval:
        - {instance_idx: 1, day: 6, utc_hour: 1, minute: 0, duration_minutes: 360}
        - {instance_idx: 2, day: 22, utc_hour: 1, minute: 0, duration_minutes: 420}
        - {instance_idx: 3, day: 27, utc_hour: 9, minute: 0, duration_minutes: 420}

  # 3. Khoang 07 tủ CAB-03 kẹt cửa nhiều ngày, door_state không đổi, heartbeat chập chờn
  - name: slot_door_jam
    category: HARDWARE
    error_code: SLOT_DOOR_JAM
    step: 6_return_battery
    kind: cabinet_slot
    cabinet_suffix: "CAB-03"
    slot_id: "07"
    fail_prob: 0.90
    windows:
      smoke:
        - {instance_idx: 1, day: 0, utc_hour: 0, minute: 0, duration_minutes: 720}
      dev:
        - {instance_idx: 1, day: 1, utc_hour: 0, minute: 0, duration_minutes: 2880}
        - {instance_idx: 2, day: 8, utc_hour: 0, minute: 0, duration_minutes: 2880}
        - {instance_idx: 3, day: 11, utc_hour: 0, minute: 0, duration_minutes: 2880}
      demo:
        - {instance_idx: 1, day: 0, utc_hour: 0, minute: 0, duration_minutes: 4320}
      eval:
        - {instance_idx: 1, day: 4, utc_hour: 0, minute: 0, duration_minutes: 4320}
        - {instance_idx: 2, day: 20, utc_hour: 0, minute: 0, duration_minutes: 4320}
        - {instance_idx: 3, day: 25, utc_hour: 0, minute: 0, duration_minutes: 4320}

  # 4. Ví điện tử PH_WALLET_1 ngừng 20' (chỉ PH)
  - name: ph_wallet_outage
    category: PAYMENT
    error_code: PAY_GATEWAY_TIMEOUT
    step: 5_payment
    kind: payment_provider
    country: "PH"
    payment_provider: "PH_WALLET_1"
    fail_prob: 0.92
    windows:
      smoke: []
      dev:
        - {instance_idx: 1, day: 4, utc_hour: 0, minute: 0, duration_minutes: 20}
        - {instance_idx: 2, day: 9, utc_hour: 9, minute: 30, duration_minutes: 20}
        - {instance_idx: 3, day: 12, utc_hour: 0, minute: 15, duration_minutes: 20}
      demo:
        - {instance_idx: 1, day: 2, utc_hour: 1, minute: 0, duration_minutes: 20}
      eval:
        - {instance_idx: 1, day: 8, utc_hour: 0, minute: 0, duration_minutes: 20}
        - {instance_idx: 2, day: 21, utc_hour: 0, minute: 0, duration_minutes: 20}
        - {instance_idx: 3, day: 24, utc_hour: 9, minute: 30, duration_minutes: 20}
        - {instance_idx: 4, day: 28, utc_hour: 0, minute: 15, duration_minutes: 20}

