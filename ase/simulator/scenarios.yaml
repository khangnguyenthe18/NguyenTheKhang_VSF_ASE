  # 8. Thiếu pin đầy giờ cao điểm (BUSINESS, NO_CHARGED_BATTERY bước 4)
  - name: peak_no_charged_battery
    category: BUSINESS
    error_code: NO_CHARGED_BATTERY
    step: 4_check_eligibility
    kind: peak_shortage
    fail_prob: 0.45
    windows:
      smoke:
        - {instance_idx: 1, day: 0, utc_hour: 10, minute: 0, duration_minutes: 120}
      dev:
        - {instance_idx: 1, day: 3, utc_hour: 10, minute: 0, duration_minutes: 120}
        - {instance_idx: 2, day: 8, utc_hour: 0, minute: 30, duration_minutes: 120}
