        - {instance_idx: 2, day: 22, utc_hour: 0, minute: 0, duration_minutes: 120}
        - {instance_idx: 3, day: 27, utc_hour: 9, minute: 0, duration_minutes: 120}

  # 6. Đã trừ tiền nhưng không nhả pin (PAYMENT P1, lỗi im lặng: captured=true, không có event bước 6/7)
  - name: paid_not_delivered
    category: PAYMENT
    error_code: PAID_NOT_DELIVERED
    step: 5_payment
    kind: silent_paid_not_delivered
    fail_prob: 0.45
