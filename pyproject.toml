[project]
name = "ase"
version = "0.1.0"
description = "ASE: AI agent kiểm tra giao dịch lỗi đổi pin VinFast (mock simulator + detector)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "orjson>=3.10",
    "polars>=1.0",
    "pyarrow>=16.0",
    "structlog>=24.1",
    "aiosmtplib>=5.1.3",
    "jinja2>=3.1.6",
    "httpx>=0.28.1",
    "tenacity>=9.2.1",
    "aiosqlite>=0.22.1",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ase"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["ase", "tests"]
